<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" role="img" aria-label="Braço Digital">
  <!-- Marca: círculo com símbolo BD -->
  <circle cx="24" cy="24" r="20" fill="#9fd0e3"/>
  <text x="24" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#12181d" text-anchor="middle">BD</text>
  <!-- Wordmark: BRAÇO + DIGITAL -->
  <text x="54" y="22" font-family="Archivo, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="1">BRAÇO</text>
  <text x="54" y="40" font-family="Archivo, Arial, sans-serif" font-size="17" font-weight="600" fill="#9fd0e3" letter-spacing="1">DIGITAL</text>
</svg>
